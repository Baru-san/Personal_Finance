<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDGER// Offline</title>
<style>
  /* Self-contained on purpose: this page must render even if style.css
     itself isn't cached yet (e.g. the very first visit was offline). */
  body {
    background: #06120a; color: #c9ffde; font-family: 'Space Mono', monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 26px; margin: 0;
  }
  .box { max-width: 420px; }
  .glyph { font-size: 48px; color: #35ff8f; text-shadow: 0 0 14px rgba(53,255,143,0.55); margin-bottom: 18px; }
  h1 { font-size: 18px; letter-spacing: 1px; color: #35ff8f; margin-bottom: 12px; text-transform: uppercase; }
  p { font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 22px; }
  a {
    display: inline-block; font-weight: 700; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; padding: 12px 22px; border: 2px solid #35ff8f; color: #35ff8f;
    text-decoration: none; box-shadow: 3px 3px 0 #1e7a4c;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="glyph">&gt;_</div>
    <h1>No signal</h1>
    <p>This page hasn't been cached yet, and there's no connection to load it now.
       Pages you've already visited stay available offline — try going back,
       or reconnect and reload.</p>
    <a href="/">&larr; Try dashboard</a>
  </div>
</body>
</html>
